<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Review & Buyer Guide | SmartStack AI</title>
  <meta name="description" id="metaDescription" content="Independent Amazon product reviews and deals evaluated by SmartStack AI.">
  
  <!-- OpenGraph Social Sharing Metadata -->
  <meta property="og:title" id="ogTitle" content="SmartStack AI Product Review">
  <meta property="og:description" id="ogDescription" content="Data-backed product review and exclusive deal offer.">
  <meta property="og:image" id="ogImage" content="https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=800&auto=format&fit=crop&q=80">
  <meta property="og:url" id="ogUrl" content="http://localhost:3000/">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="SmartStack AI">

  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="SmartStack AI Product Review">
  <meta name="twitter:description" id="twDescription" content="Data-backed product review and exclusive deal offer.">
  <meta name="twitter:image" id="twImage" content="https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=800&auto=format&fit=crop&q=80">

  <!-- JSON-LD Structured Data Schema Container -->
  <script type="application/ld+json" id="jsonLdSchema">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "SmartStack AI Product Review",
    "description": "Independent Amazon product review."
  }
  </script>

  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">⚡</div>
      <span>SmartStack <span style="color: var(--primary);">AI</span></span>
    </a>
    <nav class="nav-links">
      <a href="/" class="nav-link">← Back to All Reviews</a>
      <a href="/about" class="nav-link">About Us</a>
    </nav>
  </header>

  <!-- Article View Container -->
  <main class="article-container">
    <div id="articleLoading" style="text-align: center; padding: 60px; color: var(--text-muted);">
      <p>⏳ Loading In-Depth Product Review...</p>
    </div>

    <article id="articleMain" style="display: none;">
      <header class="article-header">
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;">
          <span class="tag-badge" id="articleCategory">BUYER GUIDE</span>
          <span class="network-badge" id="articleNetwork">Amazon Verified</span>
          <span style="color: var(--text-dark); font-size: 0.8rem;" id="articleDate">Sept 2026</span>
        </div>
        <h1 class="article-title-main" id="articleTitle">Article Title</h1>
      </header>

      <div class="article-content" id="articleContent">
        <!-- Rendered Markdown HTML inserted here -->
      </div>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 SmartStack AI. Independent Data-Driven Product Reviews.</p>
  </footer>

  <script>
    async function loadArticle() {
      const pathParts = window.location.pathname.split('/');
      const slug = pathParts[pathParts.length - 1];

      if (!slug) {
        window.location.href = '/';
        return;
      }

      try {
        const res = await fetch('/api/articles/' + slug);
        if (!res.ok) {
          document.getElementById('articleLoading').innerHTML = '<h2>Article not found</h2><p><a href="/">Return to home</a></p>';
          return;
        }

        const data = await res.json();
        
        // 1. Dynamic Title & Meta Description
        document.getElementById('pageTitle').innerText = data.title + ' | SmartStack AI';
        document.getElementById('articleTitle').innerText = data.title;
        document.getElementById('articleCategory').innerText = data.category || data.niche;
        document.getElementById('articleNetwork').innerText = 'Verified Deal';
        document.getElementById('articleDate').innerText = 'Published: ' + new Date(data.publishedAt).toLocaleDateString();
        
        const descriptionSnippet = data.snippet || (data.title + ' - Independent review, features, pros, cons, and exclusive discount deals.');
        document.getElementById('metaDescription').setAttribute('content', descriptionSnippet);

        // 2. Dynamic OpenGraph & Twitter Social Tags
        document.getElementById('ogTitle').setAttribute('content', data.title);
        document.getElementById('ogDescription').setAttribute('content', descriptionSnippet);
        document.getElementById('ogUrl').setAttribute('content', window.location.href);
        document.getElementById('twTitle').setAttribute('content', data.title);
        document.getElementById('twDescription').setAttribute('content', descriptionSnippet);

        const prodImg = data.product ? data.product.imageUrl : 'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=800&auto=format&fit=crop&q=80';
        document.getElementById('ogImage').setAttribute('content', prodImg);
        document.getElementById('twImage').setAttribute('content', prodImg);

        // 3. Dynamic JSON-LD Structured Data Schema for Google Rich Snippets (Product & Review Schemas)
        const prodName = data.product ? data.product.name : data.title;
        const prodRating = data.product ? (data.product.rating || 4.8) : 4.8;
        const prodPrice = data.product ? data.product.price.replace(/[^0-9.]/g, '') || '199.99' : '199.99';

        const schemaObj = {
          "@context": "https://schema.org",
          "@type": "Product",
          "name": prodName,
          "image": prodImg,
          "description": descriptionSnippet,
          "brand": {
            "@type": "Brand",
            "name": data.product ? (data.product.affiliateNetwork || "Amazon Verified") : "Amazon Verified"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": prodRating,
            "reviewCount": "128",
            "bestRating": "5",
            "worstRating": "1"
          },
          "review": {
            "@type": "Review",
            "author": {
              "@type": "Organization",
              "name": "SmartStack AI"
            },
            "datePublished": data.publishedAt || new Date().toISOString(),
            "description": descriptionSnippet,
            "reviewRating": {
              "@type": "Rating",
              "ratingValue": prodRating,
              "bestRating": "5",
              "worstRating": "1"
            }
          },
          "offers": {
            "@type": "Offer",
            "priceCurrency": "USD",
            "price": prodPrice,
            "availability": "https://schema.org/InStock",
            "url": window.location.href
          }
        };

        document.getElementById('jsonLdSchema').textContent = JSON.stringify(schemaObj, null, 2);

        // 4. Render Markdown Content (Enforce single H1 rule by converting body h1 tags to h2)
        let bodyHtml = data.renderedHtml || '';
        bodyHtml = bodyHtml.replace(/<h1[^>]*>(.*?)<\/h1>/gi, '<h2>$1</h2>');
        document.getElementById('articleContent').innerHTML = bodyHtml;

        document.getElementById('articleLoading').style.display = 'none';
        document.getElementById('articleMain').style.display = 'block';

      } catch (err) {
        console.error('Error loading article:', err);
        document.getElementById('articleLoading').innerText = 'Failed to load article.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>
</html>
